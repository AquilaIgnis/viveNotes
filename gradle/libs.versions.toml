[versions]
agp = "9.2.1"
# Kotlin version bundled by AGP 9.2.1's built-in Kotlin support. The compose and
# serialization compiler plugins must track this exactly. See memory/plan.md §11.
kotlin = "2.2.10"
# Independently versioned since KSP 2.3.0 — it no longer tracks `kotlin` above. 2.3.6 is the
# minimum that registers generated sources without `android.disallowKotlinSourceSets=false`.
ksp = "2.3.6"

activityCompose = "1.10.1"
composeBom = "2025.09.00"

# M3 Expressive, on purpose and on pre-release — decided 2026-08-09, `memory/plan.md` §1a.
#
# `ContainedLoadingIndicator` exists in **no stable material3 and in no Compose BOM**. Verified by
# reading the AARs, not the release notes: 1.4.0 (which even the newest BOM, 2026.06.01, pins) ships
# `LoadingIndicatorTokens` but no `LoadingIndicatorKt` — the composables were in the 1.4.0 alphas and
# pulled before stable. They are in the 1.5.0-alpha line only.
#
# material3 1.5.0-alpha25's POM requires Compose core 1.12.0-beta01, so taking it moves the whole UI
# stack off the BOM's 1.9.1. `composeCore` therefore pins every `androidx.compose.ui` artifact this
# project declares — **including the test and tooling ones**. That is the point of pinning them rather
# than letting material3 drag them transitively: material3 does not depend on `ui-test-junit4` or
# `ui-test-manifest`, so those would have stayed at the BOM's 1.9.1 while `ui` went to 1.12.0-beta01,
# and Compose's test artifacts must match `ui` exactly.
#
# The BOM stays because it still constrains the Compose artifacts nothing here names. Retire both pins
# together once a BOM ships a material3 that has the component.
material3 = "1.5.0-alpha25"
# rc01 rather than the beta01 material3 asks for: it is the same API a step further along the
# stability track, and a floor is a minimum, not a pin.
composeCore = "1.12.0-rc01"
coreKtx = "1.10.1"
# Credential Manager, for Sign in with Google. 1.6.0 is the current stable line; the
# play-services-auth adapter must move with it, since the two are released as one artifact set.
credentials = "1.6.0"
datastore = "1.1.1"
# 3.7 is the floor for anything above API 35, and it is the *third* version tried. Espresso reflects
# on `InputManager.getInstance`, which the platform removed: 3.5.1 and 3.6.1 both fail every Compose
# test on a newer emulator with NoSuchMethodException before its first assertion. Measured on an API
# 36 image rather than read from release notes. `junitVersion` and the runner move with it, because
# androidx.test ships the three as one line.
espressoCore = "3.7.0"
# `GetSignInWithGoogleOption` and `GoogleIdTokenCredential`. Versioned independently of
# androidx.credentials and published only to Google's maven, not Maven Central.
googleid = "1.2.0"
# Google Play Billing for the managed cloud-storage subscription. This is intentionally separate
# from Sign in with Google: identity and payment are different Play services with different
# credentials and lifecycles. 9.1.0 is the current stable line as of 2026-09-03.
playBilling = "9.1.0"
ink = "1.1.0-alpha06"
junit = "4.13.2"
junitVersion = "1.3.0"
# Room 2.8's migration-test serializers require the default interface methods added in 1.8.
kotlinxSerialization = "1.8.1"
lifecycle = "2.8.7"
room = "2.8.1"
ratex = "0.1.13"
onnxRuntime = "1.27.0"
chaquopy = "17.0.0"
work = "2.11.2"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeCore" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "composeCore" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "composeCore" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeCore" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeCore" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-ink-authoring = { group = "androidx.ink", name = "ink-authoring", version.ref = "ink" }
androidx-ink-brush = { group = "androidx.ink", name = "ink-brush", version.ref = "ink" }
androidx-ink-geometry = { group = "androidx.ink", name = "ink-geometry", version.ref = "ink" }
androidx-ink-rendering = { group = "androidx.ink", name = "ink-rendering", version.ref = "ink" }
androidx-ink-storage = { group = "androidx.ink", name = "ink-storage", version.ref = "ink" }
androidx-ink-strokes = { group = "androidx.ink", name = "ink-strokes", version.ref = "ink" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.7.0" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
google-identity-googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
google-play-billing = { group = "com.android.billingclient", name = "billing", version.ref = "playBilling" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version = "1.9.0" }
kotlinx-serialization-cbor = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-cbor", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ratex-android = { group = "io.github.erweixin", name = "ratex-android", version.ref = "ratex" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxRuntime" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
chaquopy-python = { id = "com.chaquo.python", version.ref = "chaquopy" }
