sdk.dir=/home/mahalo/Android/Sdk

# Managed cloud sync. Debug builds default to http://10.0.2.2:5444 (the emulator's alias for this
# machine's loopback) and release builds to https://cloud.vivenotes.net; set this to override both,
# for example when testing from a physical tablet on the LAN.
#vive.cloudBaseUrl=

# Google Web OAuth client id, handed to Credential Manager as serverClientId. Must be byte-identical
# to one of the ids in the server's VIVE_GOOGLE_CLIENT_IDS. Public identifier, not a secret. While
# it is empty, Sign in with Google is shown disabled with an explanation.
vive.googleWebClientId=
