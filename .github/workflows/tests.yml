name: Tests

# Every push, so a branch is checked before it is ever proposed. `pull_request` is what covers
# contributions from forks, whose pushes do not run this workflow — drop it if the project never
# takes outside PRs, since a same-repo branch with an open PR otherwise builds twice.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the run in progress irrelevant, and the emulator job is the
# most expensive thing here. Keyed by workflow as well as ref, so a second workflow added later does
# not start cancelling this one's runs.
#
# Master is the exception: cancelling there would leave a commit on the default branch with no
# result at all, which is the one place the history is worth paying for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon's JVM is pinned to 21 by gradle/gradle-daemon-jvm.properties. Providing
      # a matching JDK here is what stops Gradle downloading its own through foojay on every run.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Accepts the SDK licences, so AGP may fetch the compileSdk platform it needs.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Chaquopy builds the SymPy venv with a real CPython matching `chaquopy.defaultConfig.version`,
      # and the runner's system Python is 3.12 — 3.13 exists only in the tool cache. Without this the
      # build died at `installDebugPythonRequirements` on every run, so the whole workflow had never
      # once reached a test. `app/build.gradle.kts` resolves `python3.13` off PATH, which is exactly
      # what this puts there.
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Read the Gradle version the project pins
        id: gradle
        run: |
          version=$(sed -n 's|.*gradle-\(.*\)-bin\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
          test -n "$version" || { echo "no distributionUrl in gradle-wrapper.properties"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building with Gradle $version"

      # `gradlew` is not in version control (see .gitignore), so CI installs the same Gradle the
      # wrapper declares instead of calling ./gradlew. Commit the wrapper scripts and this step can
      # go away, with every `gradle` below becoming `./gradlew`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Lint
        run: gradle lint

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # The emulator job takes minutes and needs hardware acceleration; there is no point starting it
    # for a change the unit tests already reject.
    needs: unit
    env:
      API_LEVEL: '35'          # minSdk — the oldest thing this app is allowed to run on
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
      # A tablet, because the app is large-screen first (memory/plan.md §1) and parts of the View tab
      # suite assert on a page laid out beside the panes. A phone-sized window fails them for
      # reasons that have nothing to do with the code under test.
      EMULATOR_PROFILE: Nexus 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Same reason as the unit job: this one builds the APK too, so it needs the same interpreter.
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Read the Gradle version the project pins
        id: gradle
        run: |
          version=$(sed -n 's|.*gradle-\(.*\)-bin\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
          test -n "$version" || { echo "no distributionUrl in gradle-wrapper.properties"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      # Without KVM the emulator falls back to software emulation and the job times out rather than
      # failing, which is the worst way for CI to break.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the emulator
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}

      # First run only: boot the emulator once and save a snapshot, so later runs skip cold boot.
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          ram-size: 4096M
          disk-size: 6144M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          disable-animations: false
          script: echo "Snapshot saved."

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          ram-size: 4096M
          disk-size: 6144M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          # Compose drives its own clock in tests, but the system window animations are still real
          # and slow every one of them down.
          disable-animations: true
          script: gradle connectedDebugAndroidTest

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
