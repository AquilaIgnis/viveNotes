name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Read the Gradle version the project pins
        id: gradle
        run: |
          version=$(sed -n 's|.*gradle-\(.*\)-bin\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
          test -n "$version" || { echo "no distributionUrl in gradle-wrapper.properties"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building with Gradle $version"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Lint
        run: gradle lint

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
