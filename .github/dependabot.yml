# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Must equal the coroutines-core the app resolves through androidx, not the newest release;
    # see `kotlinxCoroutines` in gradle/libs.versions.toml.
    ignore:
      - dependency-name: 'org.jetbrains.kotlinx:kotlinx-coroutines-test'
      # 1.29 added telemetry; see `onnxRuntime` in gradle/libs.versions.toml.
      - dependency-name: 'com.microsoft.onnxruntime:onnxruntime-android'
        versions: ['>= 1.29']
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
